name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-signing:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Cek secret signing
        id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.ADHUNTER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Rilis dilewati: secret ADHUNTER_KEYSTORE_BASE64 belum diset."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-signing
    if: needs.check-signing.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ADHUNTER_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/adhunter-release.keystore"

      - name: Build APK rilis
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/adhunter-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ADHUNTER_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ADHUNTER_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ADHUNTER_KEY_PASSWORD }}
        run: |
          VERSION_NAME="0.1.0-build${GITHUB_RUN_NUMBER}"
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PbuildNumber="${GITHUB_RUN_NUMBER}" \
            -PversionName="${VERSION_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AdHunter-v${VERSION_NAME}.apk"

      - name: Terbitkan GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="0.1.0-build${GITHUB_RUN_NUMBER}"
          gh release create "v${VERSION_NAME}" "dist/AdHunter-v${VERSION_NAME}.apk" \
            --title "AdHunter v${VERSION_NAME}" \
            --generate-notes \
            --latest
